<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vazerk</title>
  <link rel="icon" href="logo.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="payment.css">
  <script>
  </script>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <a class="back" href="home.html">&larr; Voltar</a>
      <div class="brand">Pagamento</div>
    </header>

    <section class="payment-layout">
      <article class="product-summary">
        <div class="summary-image" id="productImage"></div>
        <div class="summary-details">
          <h1 id="productName">Carregando produto...</h1>
          <p id="productDescription">Aguarde enquanto buscamos o produto.</p>
          <div class="summary-price">
            <span>Preco</span>
            <strong id="productPrice">-</strong>
          </div>
        </div>
      </article>

      <aside class="form-panel">
        <form id="paymentForm">
          <div class="section-title">Seu contato</div>
          <label>
            Nome completo
            <input type="text" name="fullName" required>
          </label>
          <label>
            E-mail
            <input type="email" name="email" required>
          </label>
          <label>
            Telefone
            <input type="tel" name="phone" required>
          </label>

          <div class="section-title">Endereco</div>
          <label>
            Rua e numero
            <input type="text" name="address" required>
          </label>
          <label>
            Codigo postal
            <input type="text" name="postal" required>
          </label>
          <label>
            Cidade
            <input type="text" name="city" required>
          </label>
          <label>
            Pais
            <div class="country-picker">
              <input type="text" name="country" id="countryInput" placeholder="Escolha ou escreva o pais" autocomplete="off" required>
              <div class="country-list" id="countryList" role="listbox" aria-label="Lista de paises"></div>
            </div>
          </label>

          <div class="total-row">
            <span>Total a pagar</span>
            <strong id="detailTotal">-</strong>
          </div>

          <button type="button" id="payButton" class="pay-button">Pagar</button>

          <div id="formError" class="form-error" hidden></div>
        </form>
      </aside>
    </section>
  </main>

  <script src="payment.js"></script>
</body>

</html>
