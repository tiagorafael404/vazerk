<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - Vazerk</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fjalla+One|Libre+Baskerville">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .message-container {
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .success-icon {
            font-size: 64px;
            color: #2a9d8f;
            margin-bottom: 20px;
        }
        .title {
            font-family: 'Fjalla One', sans-serif;
            font-size: 32px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #111;
        }
        .text {
            font-family: 'Libre Baskerville', serif;
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: #111;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-family: 'Fjalla One', sans-serif;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #333;
        }
    </style>
</head>
<body style="background: #f4f6fb;">
    <div class="message-container">
        <i class="fas fa-check-circle success-icon"></i>
        <h1 class="title">Pagamento concluído</h1>
        <p class="text">Obrigado pela sua compra. O seu pagamento foi concluído com sucesso.</p>
        <a href="home.html" class="btn">Voltar à loja</a>
    </div>
<script src="shared-modals.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="cookies.js"></script>
<script src="item-page.js"></script>
<script src="navbar.js"></script>
</body>
</html>
